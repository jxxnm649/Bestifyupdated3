<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Products — Supplier Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="../admin/admin.css">
  <!-- A3: Supplier Portal UI layer (admin.css is shared with admin/ and super-admin/) -->
  <link rel="stylesheet" href="vendor-ui.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <aside class="bf-admin-sidebar">
      <div class="bf-admin-sidebar-brand">
        <img src="../bestify-logo.jpeg" alt="Bestify" class="bf-admin-logo-img">
        <span class="bf-admin-brand-text">Supplier Portal</span>
      </div>

      <nav class="bf-admin-nav">
        <button class="bf-admin-nav-item" onclick="location.href='dashboard.html'">📊<span>Dashboard</span></button>
        <button class="bf-admin-nav-item bf-admin-nav-active" onclick="location.href='products.html'">📦<span>My Products</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='orders.html'">🧾<span>My Orders</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='earnings.html'">🧮<span>Earnings</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='withdraw.html'">💸<span>Withdraw</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='profile.html'">🏪<span>Shop Profile</span></button>
      </nav>
    </aside>

    <div class="bf-admin-main-col">

      <header class="bf-admin-header">
        <div class="bf-admin-header-title">
          <span class="bf-admin-header-brand">Bestify</span>
          <span class="bf-admin-header-label">My Products</span>
        </div>
        <button type="button" id="logoutBtn" class="bf-btn bf-btn-ghost bf-btn-sm">🚪 Logout</button>
      </header>

      <main class="bf-admin-content">

        <section class="bf-admin-welcome">
          <h1>My Products</h1>
          <p class="bf-admin-welcome-sub">Add and manage the products you sell on Bestify.</p>
        </section>

        <div class="bf-vd-toolbar" role="search">
          <input type="search" id="productSearch" class="bf-input" placeholder="Search by name or category..." aria-label="Search products">
          <select id="productStatusFilter" class="bf-select" aria-label="Filter by status">
            <option value="All">All Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="bf-vd-count-row">
          <div id="productCount" class="bf-vd-count">Loading products...</div>
          <button type="button" id="addProductBtn" class="bf-btn bf-btn-primary">+ Add Product</button>
        </div>

        <div id="productsList" class="bf-vd-product-grid">
          <div class="bf-card" style="padding:20px;">Loading products...</div>
        </div>

      </main>

    </div>

  </div>

  <!-- Add / Edit Product Modal -->
  <div id="productFormModal" class="bf-modal-overlay">
    <div class="bf-modal bf-vd-modal-wide">
      <button type="button" class="bf-modal-close" id="productFormCloseBtn" aria-label="Close">✕</button>
      <h2 class="bf-modal-title" id="productFormTitle">Add Product</h2>

      <form id="productForm">

        <div class="bf-field">
          <label class="bf-label" for="imageFile">Product photos <span class="bf-vd-muted">(first photo is the main image) · <span id="imageCountLabel">0/8</span></span></label>
          <label class="bf-vd-file" for="imageFile">
            <span aria-hidden="true">📷</span>
            <span>Add photos</span>
            <input type="file" id="imageFile" accept="image/*" multiple>
          </label>
          <div class="bf-vd-hint">Add up to 8 photos. Remove one with its ✕.</div>
          <div id="previewRow" class="bf-vd-preview-row"></div>
        </div>

        <div class="bf-field">
          <label class="bf-label" for="productName">Product Name</label>
          <input type="text" id="productName" class="bf-input" required>
        </div>

        <div class="bf-field">
          <label class="bf-label" for="category">Category</label>
          <input type="text" id="category" class="bf-input" list="categoryList" required>
          <datalist id="categoryList"></datalist>
        </div>

        <div class="bf-vd-form-row">
          <div class="bf-field">
            <label class="bf-label" for="price">Selling Price (₹)</label>
            <input type="number" id="price" class="bf-input" min="0" required inputmode="decimal">
          </div>

          <div class="bf-field">
            <label class="bf-label" for="mrp">MRP (₹, optional)</label>
            <input type="number" id="mrp" class="bf-input" min="0" inputmode="decimal">
          </div>

          <div class="bf-field">
            <label class="bf-label" for="stock">Stock</label>
            <input type="number" id="stock" class="bf-input" min="0" required inputmode="numeric">
          </div>
        </div>

        <div class="bf-field">
          <label class="bf-label" for="description">Description</label>
          <textarea id="description" class="bf-textarea" required></textarea>
        </div>

        <div class="bf-vd-form-row bf-vd-form-row-2">
          <div class="bf-field">
            <label class="bf-label" for="sizes">Sizes <span class="bf-vd-muted">(optional)</span></label>
            <input type="text" id="sizes" class="bf-input" placeholder="S, M, L">
          </div>

          <div class="bf-field">
            <label class="bf-label" for="colours">Colours <span class="bf-vd-muted">(optional)</span></label>
            <input type="text" id="colours" class="bf-input" placeholder="Red, Blue, Black">
          </div>
        </div>

        <div class="bf-field">
          <label class="bf-label" for="returnPolicy">Return Policy</label>
          <select id="returnPolicy" class="bf-select">
            <option value="7 Days Return">7 Days Return</option>
            <option value="No Return">No Return</option>
            <option value="Custom">Custom</option>
          </select>
          <input type="text" id="returnPolicyCustom" class="bf-input" placeholder="e.g. 3 Days Replacement Only" style="display:none;margin-top:8px;">
        </div>

        <div class="bf-field">
          <label class="bf-label" for="warranty">Warranty</label>
          <select id="warranty" class="bf-select">
            <option value="6 Month Warranty">6 Month Warranty</option>
            <option value="No Warranty">No Warranty</option>
            <option value="Custom">Custom</option>
          </select>
          <input type="text" id="warrantyCustom" class="bf-input" placeholder="e.g. 1 Year Brand Warranty" style="display:none;margin-top:8px;">
        </div>

        <div class="bf-field">
          <label class="bf-label" for="status">Show on store</label>
          <select id="status" class="bf-select">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <button type="submit" id="productFormSubmitBtn" class="bf-btn bf-btn-primary bf-btn-block">
          Save Product
        </button>

      </form>
    </div>
  </div>

  <script type="module" src="products.js"></script>
  <!-- A3: shared portal UI (drawer, profile menu, Esc). No Firestore. -->
  <script type="module" src="vendor-ui.js"></script>

</body>
</html>
