<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Supplier Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="../admin/admin.css">
  <!-- A3: Supplier Portal UI layer (admin.css is shared with admin/ and super-admin/) -->
  <link rel="stylesheet" href="vendor-ui.css">
</head>

<body class="bf-admin-body">

  <div class="bf-admin-shell">

    <aside class="bf-admin-sidebar">
      <div class="bf-admin-sidebar-brand">
        <img src="../bestify-logo.jpeg" alt="Bestify" class="bf-admin-logo-img">
        <span class="bf-admin-brand-text">Supplier Portal</span>
      </div>

      <nav class="bf-admin-nav">
        <button class="bf-admin-nav-item" onclick="location.href='dashboard.html'">📊<span>Dashboard</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='products.html'">📦<span>My Products</span></button>
        <button class="bf-admin-nav-item bf-admin-nav-active" onclick="location.href='orders.html'">🧾<span>My Orders</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='earnings.html'">🧮<span>Earnings</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='withdraw.html'">💸<span>Withdraw</span></button>
        <button class="bf-admin-nav-item" onclick="location.href='profile.html'">🏪<span>Shop Profile</span></button>
      </nav>
    </aside>

    <div class="bf-admin-main-col">

      <header class="bf-admin-header">
        <div class="bf-admin-header-title">
          <span class="bf-admin-header-brand">Bestify</span>
          <span class="bf-admin-header-label">My Orders</span>
        </div>
        <button type="button" id="logoutBtn" class="bf-btn bf-btn-ghost bf-btn-sm">🚪 Logout</button>
      </header>

      <main class="bf-admin-content">

        <section class="bf-admin-welcome">
          <h1>My Orders</h1>
          <p class="bf-admin-welcome-sub">Orders that include your products. Move each one forward as you confirm, pack and ship it.</p>
        </section>

        <div class="bf-vd-toolbar" role="search">
          <input type="search" id="orderSearch" class="bf-input" placeholder="Search by customer or order number..." aria-label="Search orders">
          <select id="orderStatusFilter" class="bf-select" aria-label="Filter by status">
            <option value="All">All Status</option>
            <option value="PLACED">Placed</option>
            <option value="CONFIRMED">Confirmed</option>
            <option value="PROCESSING">Processing</option>
            <option value="PACKED">Packed</option>
            <option value="SHIPPED">Shipped</option>
            <option value="DELIVERED">Delivered</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
        </div>

        <div id="orderCount" class="bf-vd-count">Loading orders...</div>

        <div id="ordersList" class="bf-vd-list">
          <div class="bf-card" style="padding:20px;">Loading orders...</div>
        </div>

      </main>

    </div>

  </div>

  <script type="module" src="orders.js"></script>
  <!-- A3: shared portal UI (drawer, profile menu, Esc). No Firestore. -->
  <script type="module" src="vendor-ui.js"></script>

</body>
</html>
